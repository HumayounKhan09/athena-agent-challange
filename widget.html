<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Air Quality Comparison</title>
  <style>
    :root { color: #0b0b0f; font-family: "Inter", system-ui, sans-serif; }
    html, body { width: 100%; min-height: 100%; box-sizing: border-box; margin: 0; padding: 0; }
    body { padding: 16px; background: #f6f8fb; }

    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 12px;
    }

    #header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }

    #count-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      background: #e8ecff;
      color: #111bf5;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    #controls {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    #controls input,
    #controls select {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid #cad3e0;
      font-size: 14px;
      flex: 1;
      min-width: 120px;
      background: white;
    }

    #controls button {
      padding: 8px 16px;
      border-radius: 8px;
      border: none;
      background: #111bf5;
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    #controls button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      position: relative;
    }

    #results {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item-card {
      background: white;
      border-radius: 12px;
      padding: 12px 16px;
      border: 1px solid #e2e8f0;
      cursor: pointer;
      transition: box-shadow 0.15s, border-color 0.15s;
    }

    .item-card:hover,
    .item-card.selected {
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      border-color: #111bf5;
    }

    .item-card h3 {
      margin: 0 0 6px;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .severity-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      text-transform: capitalize;
    }

    .severity-good { background: #dcfce7; color: #166534; }
    .severity-moderate { background: #fef9c3; color: #854d0e; }
    .severity-unhealthy { background: #ffedd5; color: #9a3412; }
    .severity-very_unhealthy { background: #fee2e2; color: #991b1b; }

    .bar-track {
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
      margin: 8px 0 4px;
    }

    .bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.2s ease;
    }

    .bar-good { background: #22c55e; }
    .bar-moderate { background: #eab308; }
    .bar-unhealthy { background: #f97316; }
    .bar-very_unhealthy { background: #ef4444; }

    .item-card .meta {
      margin-top: 4px;
      font-size: 12px;
      color: #64748b;
    }

    .item-card .value-line {
      margin: 0;
      font-size: 13px;
      color: #475569;
    }

    #detail-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: min(360px, 100%);
      height: 100%;
      background: white;
      border-left: 1px solid #e2e8f0;
      box-shadow: -8px 0 24px rgba(15, 23, 42, 0.12);
      padding: 20px;
      transform: translateX(100%);
      transition: transform 0.2s ease;
      z-index: 10;
      overflow-y: auto;
    }

    #detail-panel.open { transform: translateX(0); }

    #detail-panel h2 {
      margin: 0 0 8px;
      font-size: 18px;
      padding-right: 32px;
    }

    #detail-panel p {
      margin: 0 0 12px;
      color: #475569;
      line-height: 1.5;
    }

    #detail-close {
      position: absolute;
      top: 16px;
      right: 16px;
      border: none;
      background: #f1f5f9;
      border-radius: 8px;
      width: 32px;
      height: 32px;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
    }

    #status {
      text-align: center;
      color: #6c768a;
      padding: 32px 0;
      font-size: 14px;
    }

    .empty-state {
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      padding: 24px;
      background: #fff;
      text-align: center;
    }

    .empty-state strong {
      display: block;
      margin-bottom: 8px;
      color: #0f172a;
    }
  </style>
</head>
<body>
  <div id="header">
    <h1>Air Quality Comparison</h1>
    <div id="count-badge">0 cities</div>
  </div>

  <script id="tool-refs" type="application/json">__TOOL_REFS_JSON__</script>

  <div id="controls">
    <input id="search-input" type="text" placeholder="Cities (e.g. London, Paris)…" />
    <input id="date-input" type="date" aria-label="Date" />
    <select id="category-filter" aria-label="Pollutant">
      <option value="pm2_5">PM2.5</option>
      <option value="pm10">PM10</option>
      <option value="ozone">Ozone</option>
    </select>
    <select id="severity-filter" aria-label="Minimum severity">
      <option value="">All severities</option>
      <option value="good">Good+</option>
      <option value="moderate">Moderate+</option>
      <option value="unhealthy">Unhealthy+</option>
      <option value="very_unhealthy">Very unhealthy only</option>
    </select>
    <select id="sort-select">
      <option value="value">Sort: pollution (low)</option>
      <option value="value_desc">Sort: pollution (high)</option>
      <option value="name">Sort: city A–Z</option>
    </select>
    <button id="search-btn" type="button">Compare</button>
  </div>

  <div id="status">Enter cities and click Compare.</div>

  <div id="layout">
    <div id="results"></div>
  </div>

  <aside id="detail-panel" aria-hidden="true">
    <button id="detail-close" type="button" aria-label="Close detail panel">&times;</button>
    <h2 id="detail-title"></h2>
    <p id="detail-description"></p>
    <p id="detail-meta"></p>
  </aside>

  <script type="module">
    const TOOL_REFS = JSON.parse(
      document.getElementById("tool-refs").textContent.trim()
    );

    const MAX_BAR = 120;

    let items = [...(window.openai?.toolOutput?.items ?? [])];
    let isLoading = false;
    let selectedItemId = window.openai?.widgetState?.selectedItemId ?? null;
    let sortKey = window.openai?.widgetState?.sortKey ?? "value_desc";
    let lastQuery = window.openai?.widgetState?.lastQuery ?? "";
    let pollutant = window.openai?.widgetState?.pollutant ?? "pm2_5";
    let itemDate = window.openai?.widgetState?.date ?? "";
    let minSeverity = window.openai?.widgetState?.minSeverity ?? "";

    const resultsEl = document.getElementById("results");
    const statusEl = document.getElementById("status");
    const searchInput = document.getElementById("search-input");
    const dateInput = document.getElementById("date-input");
    const categoryFilter = document.getElementById("category-filter");
    const severityFilter = document.getElementById("severity-filter");
    const sortSelect = document.getElementById("sort-select");
    const searchBtn = document.getElementById("search-btn");
    const countBadge = document.getElementById("count-badge");
    const detailPanel = document.getElementById("detail-panel");
    const detailTitle = document.getElementById("detail-title");
    const detailDescription = document.getElementById("detail-description");
    const detailMeta = document.getElementById("detail-meta");
    const detailClose = document.getElementById("detail-close");

    const today = () => new Date().toISOString().slice(0, 10);

    searchInput.value = lastQuery;
    categoryFilter.value = pollutant;
    severityFilter.value = minSeverity;
    sortSelect.value = sortKey;
    dateInput.value = itemDate || today();

    const persistState = () => {
      window.openai?.setWidgetState?.({
        items,
        lastQuery: searchInput.value,
        selectedItemId,
        sortKey,
        pollutant: categoryFilter.value,
        date: dateInput.value,
        minSeverity: severityFilter.value,
      });
    };

    const updateCountBadge = () => {
      const n = items.length;
      countBadge.textContent = n === 1 ? "1 city" : `${n} cities`;
    };

    const severityClass = (band) => `severity-${band || "good"}`;

    const barWidth = (value) => {
      const v = Number(value) || 0;
      return `${Math.min(100, (v / MAX_BAR) * 100)}%`;
    };

    const sortItems = () => {
      sortKey = sortSelect.value;
      const reverse = sortKey.endsWith("_desc");
      const key = reverse ? sortKey.replace(/_desc$/, "") : sortKey;
      items = [...items].sort((a, b) => {
        if (key === "value") {
          const cmp = Number(a.value) - Number(b.value);
          return reverse ? -cmp : cmp;
        }
        const left = String(a[key] ?? a.name ?? "");
        const right = String(b[key] ?? b.name ?? "");
        const cmp = left.localeCompare(right);
        return reverse ? -cmp : cmp;
      });
    };

    const closeDetailPanel = () => {
      selectedItemId = null;
      detailPanel.classList.remove("open");
      detailPanel.setAttribute("aria-hidden", "true");
      persistState();
      render();
    };

    const openDetailPanel = (item) => {
      selectedItemId = item.id;
      detailTitle.textContent = item.name ?? item.id ?? "City";
      detailDescription.textContent = item.description ?? "No details available.";
      detailMeta.textContent = [
        item.pollutant?.toUpperCase?.() || item.pollutant,
        item.value != null ? `${item.value} ${item.unit || ""}` : "",
        item.date,
        item.category,
      ]
        .filter(Boolean)
        .join(" · ");
      detailPanel.classList.add("open");
      detailPanel.setAttribute("aria-hidden", "false");
      persistState();
      render();
    };

    const render = () => {
      resultsEl.innerHTML = "";
      updateCountBadge();

      if (isLoading) {
        statusEl.textContent = "Loading…";
        statusEl.style.display = "block";
        searchBtn.disabled = true;
        return;
      }

      searchBtn.disabled = false;

      if (items.length === 0) {
        statusEl.innerHTML = `
          <div class="empty-state">
            <strong>No readings found</strong>
            <span>Try other cities, a different date, or lower the severity filter.</span>
          </div>
        `;
        statusEl.style.display = "block";
        persistState();
        return;
      }

      statusEl.style.display = "none";

      const maxVal = Math.max(...items.map((i) => Number(i.value) || 0), 1);

      items.forEach((item) => {
        const card = document.createElement("div");
        card.className = "item-card";
        if (item.id === selectedItemId) {
          card.classList.add("selected");
        }
        const band = item.category || "good";
        const pct = `${Math.min(100, ((Number(item.value) || 0) / maxVal) * 100)}%`;
        card.innerHTML = `
          <h3>
            <span>${item.name ?? item.id ?? "City"}</span>
            <span class="severity-badge ${severityClass(band)}">${band.replace(/_/g, " ")}</span>
          </h3>
          <div class="bar-track">
            <div class="bar-fill bar-${band}" style="width: ${pct}"></div>
          </div>
          <p class="value-line">${item.value ?? "—"} ${item.unit || ""}</p>
          <div class="meta">${[item.pollutant, item.date].filter(Boolean).join(" · ")}</div>
        `;
        card.addEventListener("click", () => openDetailPanel(item));
        resultsEl.appendChild(card);
      });

      persistState();
    };

    const toolPayloadBase = () => ({
      query: lastQuery || searchInput.value.trim(),
      pollutant: categoryFilter.value,
      date: dateInput.value || today(),
      sort_by: sortSelect.value,
      min_severity: severityFilter.value,
    });

    const updateFromResponse = (response) => {
      if (response?.structuredContent?.items) {
        items = response.structuredContent.items;
        isLoading = false;
        if (response.structuredContent.pollutant) {
          categoryFilter.value = response.structuredContent.pollutant;
        }
        if (response.structuredContent.date) {
          dateInput.value = response.structuredContent.date;
        }
        sortItems();
        render();
      }
    };

    window.addEventListener(
      "openai:set_globals",
      (event) => {
        const globals = event.detail?.globals;
        if (globals?.toolOutput?.items) {
          items = globals.toolOutput.items;
          render();
        }
        if (globals?.widgetState) {
          selectedItemId = globals.widgetState.selectedItemId ?? selectedItemId;
          sortKey = globals.widgetState.sortKey ?? sortKey;
          sortSelect.value = sortKey;
          lastQuery = globals.widgetState.lastQuery ?? lastQuery;
          searchInput.value = lastQuery;
          pollutant = globals.widgetState.pollutant ?? pollutant;
          categoryFilter.value = pollutant;
          minSeverity = globals.widgetState.minSeverity ?? minSeverity;
          severityFilter.value = minSeverity;
          itemDate = globals.widgetState.date ?? itemDate;
          if (itemDate) dateInput.value = itemDate;
        }
      },
      { passive: true }
    );

    const callTool = async (name, payload) => {
      if (!window.openai?.callTool) {
        console.log("[dev] callTool", name, payload);
        return;
      }
      isLoading = true;
      render();
      try {
        const response = await window.openai.callTool(name, payload);
        updateFromResponse(response);
      } catch (err) {
        isLoading = false;
        statusEl.textContent = `Error: ${err.message}`;
        statusEl.style.display = "block";
        render();
      }
    };

    const runSearch = async () => {
      const query = searchInput.value.trim();
      lastQuery = query;
      pollutant = categoryFilter.value;
      itemDate = dateInput.value || today();
      await callTool(TOOL_REFS.search, {
        query,
        limit: 20,
        pollutant,
        date: itemDate,
      });
    };

    const runFilter = async () => {
      lastQuery = searchInput.value.trim();
      pollutant = categoryFilter.value;
      minSeverity = severityFilter.value;
      itemDate = dateInput.value || today();
      await callTool(TOOL_REFS.filter, toolPayloadBase());
    };

    searchBtn.addEventListener("click", runSearch);

    searchInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        runSearch();
      }
    });

    categoryFilter.addEventListener("change", runFilter);
    severityFilter.addEventListener("change", runFilter);
    dateInput.addEventListener("change", () => {
      if (lastQuery || items.length) runFilter();
    });

    sortSelect.addEventListener("change", () => {
      sortItems();
      render();
    });

    detailClose.addEventListener("click", closeDetailPanel);

    sortItems();
    render();
  </script>
</body>
</html>
