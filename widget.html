<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Air Quality Comparison</title>
  <script id="tool-refs" type="application/json">__TOOL_REFS_JSON__</script>
  <style>
    :root {
      color-scheme: light dark;
      --color-text: #0b0b0f;
      --color-text-secondary: #475569;
      --color-text-tertiary: #64748b;
      --color-surface: #ffffff;
      --color-surface-elevated: #f8fafc;
      --color-border: #e2e8f0;
      --color-border-subtle: #cbd5e1;
      --color-primary: #111bf5;
      --color-primary-soft: #e8ecff;
      --font-family: "Inter", system-ui, -apple-system, sans-serif;
      --radius-md: 8px;
      --radius-lg: 12px;
      --radius-xl: 16px;
      --shadow-card: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    html[data-theme="dark"],
    :host([data-theme="dark"]) {
      --color-text: #f8fafc;
      --color-text-secondary: #cbd5e1;
      --color-text-tertiary: #94a3b8;
      --color-surface: #111827;
      --color-surface-elevated: #1f2937;
      --color-border: #334155;
      --color-border-subtle: #475569;
      --color-primary-soft: #1e293b;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      padding: 16px;
      background: var(--color-surface-elevated);
      color: var(--color-text);
      font-family: var(--font-family);
      -webkit-font-smoothing: antialiased;
    }

    main {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
    }

    #header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 12px;
    }

    #header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }

    #count-badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 10px;
      border-radius: 999px;
      background: var(--color-primary-soft);
      color: var(--color-primary);
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
    }

    #controls {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    #controls input,
    #controls select {
      padding: 8px 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--color-border-subtle);
      font-size: 14px;
      flex: 1;
      min-width: 120px;
      background: var(--color-surface);
      color: var(--color-text);
    }

    #controls button {
      padding: 8px 16px;
      border-radius: var(--radius-md);
      border: none;
      background: var(--color-primary);
      color: white;
      font-weight: 600;
      cursor: pointer;
    }

    #controls button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    #layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 12px;
      position: relative;
    }

    #results {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .item-card {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      padding: 12px 16px;
      border: 1px solid var(--color-border);
      cursor: pointer;
      transition: box-shadow 0.15s, border-color 0.15s;
    }

    .item-card:hover,
    .item-card.selected {
      box-shadow: var(--shadow-card);
      border-color: var(--color-primary);
    }

    .item-card h3 {
      margin: 0 0 6px;
      font-size: 15px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .severity-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      text-transform: capitalize;
    }

    .severity-good { background: #dcfce7; color: #166534; }
    .severity-moderate { background: #fef9c3; color: #854d0e; }
    .severity-unhealthy { background: #ffedd5; color: #9a3412; }
    .severity-very_unhealthy { background: #fee2e2; color: #991b1b; }

    .bar-track {
      height: 8px;
      background: var(--color-border);
      border-radius: 4px;
      overflow: hidden;
      margin: 8px 0 4px;
    }

    .bar-fill {
      height: 100%;
      border-radius: 4px;
      transition: width 0.2s ease;
    }

    .bar-good { background: #22c55e; }
    .bar-moderate { background: #eab308; }
    .bar-unhealthy { background: #f97316; }
    .bar-very_unhealthy { background: #ef4444; }

    .item-card .meta {
      margin-top: 4px;
      font-size: 12px;
      color: var(--color-text-tertiary);
    }

    .item-card .value-line {
      margin: 0;
      font-size: 13px;
      color: var(--color-text-secondary);
    }

    #detail-panel {
      position: fixed;
      top: 0;
      right: 0;
      width: min(360px, 100%);
      height: 100%;
      background: var(--color-surface);
      border-left: 1px solid var(--color-border);
      box-shadow: -8px 0 24px rgba(15, 23, 42, 0.12);
      padding: 20px;
      transform: translateX(100%);
      transition: transform 0.2s ease;
      z-index: 10;
      overflow-y: auto;
    }

    #detail-panel.open { transform: translateX(0); }

    #detail-panel h2 {
      margin: 0 0 8px;
      font-size: 18px;
      padding-right: 32px;
    }

    #detail-panel p {
      margin: 0 0 12px;
      color: var(--color-text-secondary);
      line-height: 1.5;
    }

    #detail-close {
      position: absolute;
      top: 16px;
      right: 16px;
      border: none;
      background: var(--color-surface-elevated);
      border-radius: var(--radius-md);
      width: 32px;
      height: 32px;
      cursor: pointer;
      font-size: 18px;
      line-height: 1;
      color: var(--color-text);
    }

    #status {
      text-align: center;
      color: var(--color-text-tertiary);
      padding: 32px 0;
      font-size: 14px;
    }

    .empty-state {
      border: 1px dashed var(--color-border-subtle);
      border-radius: var(--radius-lg);
      padding: 24px;
      background: var(--color-surface);
      text-align: center;
    }

    .empty-state strong {
      display: block;
      margin-bottom: 8px;
      color: var(--color-text);
    }
  </style>
</head>
<body>
  <main>
    <div id="header">
      <h1>Air Quality Comparison</h1>
      <div id="count-badge">0 cities</div>
    </div>

    <div id="controls">
      <input id="search-input" type="text" placeholder="Cities (e.g. London, Paris)…" />
      <input id="date-input" type="date" aria-label="Date" />
      <select id="category-filter" aria-label="Pollutant">
        <option value="pm2_5">PM2.5</option>
        <option value="pm10">PM10</option>
        <option value="ozone">Ozone</option>
      </select>
      <select id="severity-filter" aria-label="Minimum severity">
        <option value="">All severities</option>
        <option value="good">Good+</option>
        <option value="moderate">Moderate+</option>
        <option value="unhealthy">Unhealthy+</option>
        <option value="very_unhealthy">Very unhealthy only</option>
      </select>
      <select id="sort-select">
        <option value="value">Sort: pollution (low)</option>
        <option value="value_desc">Sort: pollution (high)</option>
        <option value="name">Sort: city A–Z</option>
      </select>
      <button id="search-btn" type="button">Compare</button>
    </div>

    <div id="status">Enter cities and click Compare.</div>

    <div id="layout">
      <div id="results"></div>
    </div>
  </main>

  <aside id="detail-panel" aria-hidden="true">
    <button id="detail-close" type="button" aria-label="Close detail panel">&times;</button>
    <h2 id="detail-title"></h2>
    <p id="detail-description"></p>
    <p id="detail-meta"></p>
  </aside>

  <script type="module">
    const TOOL_REFS = JSON.parse(
      document.getElementById("tool-refs").textContent.trim()
    );

    const MAX_BAR = 120;

    let items = [...(window.openai?.toolOutput?.items ?? [])];
    let isLoading = false;
    let selectedItemId = window.openai?.widgetState?.selectedItemId ?? null;
    let sortKey = window.openai?.widgetState?.sortKey ?? "value_desc";
    let lastQuery = window.openai?.widgetState?.lastQuery ?? "";
    let pollutant = window.openai?.widgetState?.pollutant ?? "pm2_5";
    let itemDate = window.openai?.widgetState?.date ?? "";
    let minSeverity = window.openai?.widgetState?.minSeverity ?? "";

    const resultsEl = document.getElementById("results");
    const statusEl = document.getElementById("status");
    const searchInput = document.getElementById("search-input");
    const dateInput = document.getElementById("date-input");
    const categoryFilter = document.getElementById("category-filter");
    const severityFilter = document.getElementById("severity-filter");
    const sortSelect = document.getElementById("sort-select");
    const searchBtn = document.getElementById("search-btn");
    const countBadge = document.getElementById("count-badge");
    const detailPanel = document.getElementById("detail-panel");
    const detailTitle = document.getElementById("detail-title");
    const detailDescription = document.getElementById("detail-description");
    const detailMeta = document.getElementById("detail-meta");
    const detailClose = document.getElementById("detail-close");

    const today = () => new Date().toISOString().slice(0, 10);

    const applyTheme = () => {
      const theme = window.openai?.theme;
      if (theme === "dark" || theme === "light") {
        document.documentElement.dataset.theme = theme;
      }
    };

    const notifyHeight = () => {
      const height = Math.ceil(document.documentElement.scrollHeight);
      window.openai?.notifyIntrinsicHeight?.(height);
    };

    searchInput.value = lastQuery;
    categoryFilter.value = pollutant;
    severityFilter.value = minSeverity;
    sortSelect.value = sortKey;
    dateInput.value = itemDate || today();
    applyTheme();

    const persistState = () => {
      window.openai?.setWidgetState?.({
        items,
        lastQuery: searchInput.value,
        selectedItemId,
        sortKey,
        pollutant: categoryFilter.value,
        date: dateInput.value,
        minSeverity: severityFilter.value,
      });
    };

    const updateCountBadge = () => {
      const n = items.length;
      countBadge.textContent = n === 1 ? "1 city" : `${n} cities`;
    };

    const severityClass = (band) => `severity-${band || "good"}`;

    const sortItems = () => {
      sortKey = sortSelect.value;
      const reverse = sortKey.endsWith("_desc");
      const key = reverse ? sortKey.replace(/_desc$/, "") : sortKey;
      items = [...items].sort((a, b) => {
        if (key === "value") {
          const cmp = Number(a.value) - Number(b.value);
          return reverse ? -cmp : cmp;
        }
        const left = String(a[key] ?? a.name ?? "");
        const right = String(b[key] ?? b.name ?? "");
        const cmp = left.localeCompare(right);
        return reverse ? -cmp : cmp;
      });
    };

    const closeDetailPanel = () => {
      selectedItemId = null;
      detailPanel.classList.remove("open");
      detailPanel.setAttribute("aria-hidden", "true");
      persistState();
      render();
    };

    const openDetailPanel = (item) => {
      selectedItemId = item.id;
      detailTitle.textContent = item.name ?? item.id ?? "City";
      detailDescription.textContent = item.description ?? "No details available.";
      detailMeta.textContent = [
        item.pollutant?.toUpperCase?.() || item.pollutant,
        item.value != null ? `${item.value} ${item.unit || ""}` : "",
        item.date,
        item.category,
      ]
        .filter(Boolean)
        .join(" · ");
      detailPanel.classList.add("open");
      detailPanel.setAttribute("aria-hidden", "false");
      persistState();
      render();
    };

    const render = () => {
      resultsEl.innerHTML = "";
      updateCountBadge();

      if (isLoading) {
        statusEl.textContent = "Loading…";
        statusEl.style.display = "block";
        searchBtn.disabled = true;
        notifyHeight();
        return;
      }

      searchBtn.disabled = false;

      if (items.length === 0) {
        statusEl.innerHTML = `
          <div class="empty-state">
            <strong>No readings found</strong>
            <span>Try other cities, a different date, or lower the severity filter.</span>
          </div>
        `;
        statusEl.style.display = "block";
        persistState();
        notifyHeight();
        return;
      }

      statusEl.style.display = "none";

      const maxVal = Math.max(...items.map((i) => Number(i.value) || 0), 1);

      items.forEach((item) => {
        const card = document.createElement("div");
        card.className = "item-card";
        if (item.id === selectedItemId) {
          card.classList.add("selected");
        }
        const band = item.category || "good";
        const pct = `${Math.min(100, ((Number(item.value) || 0) / maxVal) * 100)}%`;
        card.innerHTML = `
          <h3>
            <span>${item.name ?? item.id ?? "City"}</span>
            <span class="severity-badge ${severityClass(band)}">${band.replace(/_/g, " ")}</span>
          </h3>
          <div class="bar-track">
            <div class="bar-fill bar-${band}" style="width: ${pct}"></div>
          </div>
          <p class="value-line">${item.value ?? "—"} ${item.unit || ""}</p>
          <div class="meta">${[item.pollutant, item.date].filter(Boolean).join(" · ")}</div>
        `;
        card.addEventListener("click", () => openDetailPanel(item));
        resultsEl.appendChild(card);
      });

      persistState();
      notifyHeight();
    };

    const applyToolResult = (toolResult) => {
      if (!toolResult?.structuredContent?.items) return;
      items = toolResult.structuredContent.items;
      isLoading = false;
      if (toolResult.structuredContent.pollutant) {
        categoryFilter.value = toolResult.structuredContent.pollutant;
        pollutant = categoryFilter.value;
      }
      if (toolResult.structuredContent.date) {
        dateInput.value = toolResult.structuredContent.date;
        itemDate = dateInput.value;
      }
      sortItems();
      render();
    };

    const applyGlobals = (globals) => {
      if (globals?.toolOutput?.items) {
        items = globals.toolOutput.items;
        render();
      }
      if (globals?.widgetState) {
        selectedItemId = globals.widgetState.selectedItemId ?? selectedItemId;
        sortKey = globals.widgetState.sortKey ?? sortKey;
        sortSelect.value = sortKey;
        lastQuery = globals.widgetState.lastQuery ?? lastQuery;
        searchInput.value = lastQuery;
        pollutant = globals.widgetState.pollutant ?? pollutant;
        categoryFilter.value = pollutant;
        minSeverity = globals.widgetState.minSeverity ?? minSeverity;
        severityFilter.value = minSeverity;
        itemDate = globals.widgetState.date ?? itemDate;
        if (itemDate) dateInput.value = itemDate;
      }
      if (globals?.theme) {
        applyTheme();
      }
    };

    window.addEventListener(
      "openai:set_globals",
      (event) => {
        applyGlobals(event.detail?.globals);
      },
      { passive: true }
    );

    window.addEventListener(
      "message",
      (event) => {
        if (event.source !== window.parent) return;
        const message = event.data;
        if (!message || message.jsonrpc !== "2.0") return;

        if (message.method === "ui/notifications/tool-result") {
          applyToolResult(message.params);
          return;
        }

        if (message.method === "ui/notifications/tool-input") {
          const input = message.params;
          if (input?.query) {
            lastQuery = input.query;
            searchInput.value = lastQuery;
          }
          if (input?.pollutant) {
            pollutant = input.pollutant;
            categoryFilter.value = pollutant;
          }
          if (input?.date) {
            itemDate = input.date;
            dateInput.value = itemDate;
          }
        }
      },
      { passive: true }
    );

    const callTool = async (name, payload) => {
      if (!window.openai?.callTool) {
        console.log("[dev] callTool", name, payload);
        return;
      }
      isLoading = true;
      render();
      try {
        const response = await window.openai.callTool(name, payload);
        applyToolResult(response);
      } catch (err) {
        isLoading = false;
        statusEl.textContent = `Error: ${err.message}`;
        statusEl.style.display = "block";
        render();
      }
    };

    const runSearch = async () => {
      const query = searchInput.value.trim();
      lastQuery = query;
      pollutant = categoryFilter.value;
      itemDate = dateInput.value || today();
      await callTool(TOOL_REFS.search, {
        query,
        limit: 20,
        pollutant,
        date: itemDate,
      });
    };

    const runFilter = async () => {
      lastQuery = searchInput.value.trim();
      pollutant = categoryFilter.value;
      minSeverity = severityFilter.value;
      itemDate = dateInput.value || today();
      await callTool(TOOL_REFS.filter, {
        query: lastQuery,
        category: "",
        sort_by: sortSelect.value,
        pollutant,
        date: itemDate,
        min_severity: minSeverity,
      });
    };

    searchBtn.addEventListener("click", runSearch);

    searchInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        runSearch();
      }
    });

    categoryFilter.addEventListener("change", runFilter);
    severityFilter.addEventListener("change", runFilter);
    dateInput.addEventListener("change", () => {
      if (lastQuery || items.length) runFilter();
    });

    sortSelect.addEventListener("change", () => {
      sortItems();
      render();
    });

    detailClose.addEventListener("click", closeDetailPanel);

    sortItems();
    render();
  </script>
</body>
</html>
